<script>
// ======== CONFIGURAÇÃO (preencha para salvar os dados no Supabase de verdade) ========
const SUPABASE_URL = '';       // ex.: https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY = '';  // chave pública (anon / publishable) do projeto
const PRODUTO_URL = '';        // deixe vazio: a plataforma (questionário e plano) já está neste site
const CHECKOUT_URL = '';       // link de pagamento/renovação (botão da tela de assinatura inativa)
// =======================================================================================

const DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY, SK = 'yg_sessao';
const MESTRA_SALT = 'yourglow-demo-v1', MESTRA_ITER = 150000, MESTRA_HASH = 'e1784ed75bd69f8dc2c44c9e4e1ac144c210af63e123b99475d9c2aac5a1233f';
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MSG = {
  credenciais: 'Usuário ou senha incorretos.',
  expirado: 'O teu acesso de 31 dias expirou. Entre em contacto para renovar!',
  bloqueado: 'Muitas tentativas seguidas. Aguarda 15 minutos e tenta de novo.',
  senha_mestra: 'Senha mestra incorreta.',
  usuario_existe: 'Já existe um cliente com esse usuário. Escolhe outro.',
  dados_invalidos: 'Preenche todos os campos. A senha precisa de pelo menos 4 caracteres.',
  nao_encontrado: 'Cliente não encontrado.',
  config: 'O banco ainda não está configurado. Rode os arquivos SQL (01 e 02) no Supabase.',
  chave: 'Chave do Supabase inválida. Confira o SUPABASE_ANON_KEY no código.',
  sem_crypto: 'Este navegador não permite o modo demonstração. Abra o site em HTTPS.',
  rede: 'Não foi possível conectar. Tenta novamente.'
};

// Armazenamento: usa o navegador e, se ele bloquear, guarda na memória da página
const ls = (() => {
  const mem = {};
  return {
    get: k => { try { const v = localStorage.getItem(k); if (v !== null) return v } catch (e) {} return mem[k] ?? null },
    set: (k, v) => { mem[k] = v; try { localStorage.setItem(k, v) } catch (e) {} },
    del: k => { delete mem[k]; try { localStorage.removeItem(k) } catch (e) {} }
  };
})();

// ---------- Modo Supabase: chama as funções dos arquivos SQL ----------
async function rpc(fn, args) {
  let r;
  try {
    r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify(args)
    });
  } catch (e) { return { ok: false, erro: 'rede' } }
  if (r.status === 404) return { ok: false, erro: 'config' };
  if (r.status === 401 || r.status === 403) return { ok: false, erro: 'chave' };
  if (!r.ok) return { ok: false, erro: 'rede' };
  try { const d = await r.json(); return d && typeof d === 'object' ? d : { ok: false, erro: 'rede' } }
  catch (e) { return { ok: false, erro: 'rede' } }
}
const par = (m, u, extra = {}) => ({ p_senha_mestra: m, p_usuario: u, ...extra });
const supa = {
  adminVerificar: m => rpc('admin_verificar', { p_senha_mestra: m }),
  adminCriar: (m, n, u, s) => rpc('admin_criar_cliente', { p_senha_mestra: m, p_nome: n, p_usuario: u, p_senha: s }),
  listar: m => rpc('admin_listar_clientes', { p_senha_mestra: m }),
  renovar: (m, u) => rpc('admin_renovar_cliente', par(m, u)),
  bloquear: (m, u) => rpc('admin_bloquear_cliente', par(m, u)),
  excluir: (m, u) => rpc('admin_excluir_cliente', par(m, u)),
  redefinir: (m, u, n) => rpc('admin_redefinir_senha', par(m, u, { p_nova_senha: n })),
  async login(u, s) {
    const r = await rpc('cliente_login', { p_usuario: u, p_senha: s });
    if (r.ok && r.token) { ls.set(SK, r.token); ls.set('yg_user', nu(u)) }
    return r;
  },
  async sessao() { const t = ls.get(SK); return t ? rpc('cliente_sessao', { p_token: t }) : { ok: false, erro: 'sessao' } },
  async sair() { const t = ls.get(SK); ls.del(SK); ls.del('yg_user'); if (t) await rpc('cliente_logout', { p_token: t }) }
};

// ---------- Modo demonstração: tudo guardado só neste navegador ----------
const enc = t => new TextEncoder().encode(t);
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
const temCrypto = () => !!(globalThis.crypto && crypto.subtle);
// PBKDF2-HMAC-SHA256 em JavaScript puro: reserva para navegadores sem crypto.subtle
const _P = []; for (let n = 2; _P.length < 64; n++) if (_P.every(p => n % p)) _P.push(n);
const _K = _P.map(p => Math.floor((Math.cbrt(p) % 1) * 4294967296)), _H0 = _P.slice(0, 8).map(p => Math.floor((Math.sqrt(p) % 1) * 4294967296));
const _rr = (x, n) => (x >>> n) | (x << (32 - n));
function _comp(st, blk) {

function gerar(R) {
  const modo = R.orc === '0' || R.pref === 'natural' ? 'nat' : R.pref === 'hibrido' ? 'hib' : 'prod';
  const tier = modo === 'prod' ? ({ '50-100': 1, '100-250': 2, '250+': 3 }[R.orc] || 1) : 1;
  const bp = modo !== 'nat', cp = modo === 'prod';
  const cap = { '5': [3, 3], '15': [4, 5], '30': [9, 9] }[R.tempo] || [4, 5];
  const qs = (R.queixas || []).filter(k => QX[k]), H = HAIR[R.cabelo] || HAIR.liso;
  const dias = [];
  for (let n = 1; n <= 30; n++) {
    const w = Math.min(3, (n - 1) / 7 | 0), b = (n - 1) % 7, it = [];
    const add = (t, o, p, x, pre = '') => { const a = ALT[x]; it.push({ t, o, p, x: pre + x, alt: a ? { ings: a[0], x: pre + a[1], ou: !!a[2] } : null }) };
    add('AM', 1, 1, bp ? `Limpe o rosto com ${SKN[R.pele]}` : 'Lave o rosto com água morna (e sabonete neutro, se a pele pedir)');
    add('AM', 3, 2, bp ? `Aplique ${HID[R.pele]}` : 'Passe gel de babosa fino no rosto e no pescoço');
    add('AM', 4, 1, bp ? 'Passe protetor solar FPS 30+ e reaplique a cada 3h no sol' : 'Proteja-se do sol: boné, sombra e óculos escuros ao sair');
    add('AM', 9, 4, 'Beba um copo de água ao acordar e mantenha 2 litros ao longo do dia');
    add('PM', 1, 1, bp ? 'Limpe bem o rosto e remova o protetor solar' : 'Lave o rosto com água morna e sabonete neutro');
    add('PM', 4, 2, bp ? 'Hidrate com o seu creme da noite' : (R.pele === 'seca' ? 'Hidrate com gel de babosa e uma gota de óleo de girassol' : 'Hidrate com gel de babosa'));
    add('PM', 9, 4, 'Desligue as telas 30 minutos antes de dormir');
    if (n === 1) add('AM', 0, 2, 'Tire uma foto do rosto com luz natural, sem filtro, para comparar no fim');
    else if (n === 30) add('AM', 0, 2, 'Foto final! Compare com a do dia 1 e comemore');
    else if (n === 28) add('AM', 0, 2, 'Foto de comparação, na mesma luz e ângulo do dia 1');
    else if (b === 6) add('AM', 0, 2, 'Revisão da semana: tire uma nova foto e anote o que mudou');
    if (w === 0) {
      if (n === 1) add('PM', 2, 2, 'Troque a fronha do travesseiro e lave a toalha de rosto');
      add('PM', 5, 3, n % 2 ? 'Reduza açúcar, frituras e refrigerante hoje' : 'Coma uma fruta a mais e beba bastante água hoje');
      if (b === 3) add('PM', 5, 3, 'Observe a pele sem tocar nela e anote como reage à rotina');
    } else {
      qs.forEach((k, j) => {
        const c = QX[k];
        add('AM', 2, 3, (cp ? c.p : c.n).am);
        if (!cp || !c.act || (n + j) % 2 === 0) add('PM', 3, 2, (cp ? c.p : c.n).pm);
        if ((b === 2 || b === 5) && n < 28) add('PM', 5, 3, (cp && c.wp ? c.wp : c.w)[w - 1], `${c.nm}: `);
      });
      if (R.obj === 'glow' && b % 2 === 0) add('PM', 6, 4, 'Drenagem facial com as mãos por 2 minutos, de dentro para fora');
      if (R.obj === 'glow' && b % 2 === 1) add('AM', 6, 4, 'Gelo facial por 1 minuto, envolto em pano fino');
      if (R.obj === 'pele' && b === 4) add('PM', 5, 3, bp && !cp ? 'Máscara caseira de aveia com iogurte por 10 minutos' : cp ? 'Máscara hidratante por 10 minutos' : 'Máscara caseira de aveia com iogurte por 10 minutos');
    }
    if (n % H.f === 0 && n < 30) add('PM', 7, 3, cp ? H.pl : H.nl, 'Dia de lavar o cabelo: ');
    if (b === 6) add('PM', 7, 2, cp ? H.pt : H.nt, 'Tratamento semanal do cabelo: ');
    if (R.obj === 'cabelo') { add('PM', 8, 3, 'Massageie o couro cabeludo por 3 minutos'); if (b === 2) add('PM', 7, 2, cp ? H.pt : H.nt, 'Tratamento extra do cabelo: ') }
    const post = R.obj === 'postura';
    if (w === 2 || post) { add('AM', 5, 3, 'Alongue pescoço e peitoral por 2 minutos e alinhe os ombros'); add('PM', 6, 3, 'Alongue costas e quadril por 3 minutos') }
    if ((w === 2 && b % 2 === 1) || (post && w >= 1 && b % 2 === 0)) add('PM', 7, 3, EXER[(n / 2 | 0) % 3]);
    if (w === 2 && (b === 1 || (b === 4 && R.pele !== 'sensivel'))) add('PM', 3.5, 2, cp && tier >= 2 ? 'Esfoliação química suave (ácido lático ou mandélico), só nesta noite e sem outros ativos' : 'Esfoliação suave: aveia com iogurte, em círculos leves por 1 minuto');
    if (w === 3 && b === 2) add('PM', 5, 3, 'Mantenha só o que funcionou: simplifique sem perder os passos básicos');
    if (n === 29) add('PM', 5, 2, 'Monte a sua rotina de manutenção: escolha os 3 passos que mais funcionaram');
    const tur = t => it.filter(x => x.t === t).map((x, i) => ({ ...x, i })).sort((a, c) => a.p - c.p || a.i - c.i).slice(0, cap[t === 'AM' ? 0 : 1]).sort((a, c) => a.o - c.o || a.i - c.i);
    dias.push({ n, sem: w, tema: n === 30 ? 'Fechamento: seu novo ritual' : TEMAS[w][b], itens: [...tur('AM'), ...tur('PM')].map(x => ({ t: x.t, x: x.x, alt: x.alt })) });
  }
  const guia = [];
  if (modo === 'nat') guia.push({ t: 'Ingredientes e técnicas', i: [...NATG, 'Se um dia puder investir em um único item, escolha um protetor solar simples FPS 30+. Ele muda mais a sua pele do que qualquer receita'] });
  else if (modo === 'hib') guia.push({ t: 'Produtos essenciais de farmácia', i: BASEP[1] }, { t: 'Receitas e técnicas naturais', i: NATG });
  else guia.push({ t: 'Rotina base de produtos', i: BASEP[tier] });
  if (qs.length) guia.push({ t: 'Para as suas queixas', i: qs.map(k => QX[k].g[cp ? tier : 'n']) });
  guia.push({ t: `Cabelo ${R.cabelo}`, i: [`${cp ? 'Produtos' : 'Receita'}: ${cp ? H.pt : H.nt}`] });
  const nome = (R.nome || '').trim();
  const forc = R.orc === '0' && R.pref !== 'natural' ? ' Como o orçamento é R$ 0,00, montamos a versão 100% natural, só com o que você tem em casa.' : '';
  return {
    modo, dias, guia,
    titulo: `Olá, ${nome}!`,
    texto: `Criamos o seu plano exclusivo de 30 dias. Adaptamos cada etapa para o seu perfil de pele ${R.pele === 'sensivel' ? 'sensível' : R.pele} e considerando o seu investimento selecionado (${ORCL[R.orc]}).${forc} Vamos juntos transformar sua rotina!`,
    nota: modo === 'nat'
      ? 'Teste cada receita em uma área pequena antes de usar no rosto. Em caso de dor, inflamação forte ou manchas que mudam, procure um dermatologista.'
      : 'As marcas são exemplos de referência. Confira preço e disponibilidade e prefira equivalentes com o mesmo ativo. Teste cada produto novo em uma área pequena. Em caso de dor, inflamação forte ou manchas que mudam, procure um dermatologista.'
  };
}

  const el = $('#fx'), tt = $('#toast'); if (!el || !tt) return;
  const cores = ['#DE3345', '#ffffff', '#ff7a88'];
  const parts = q => Array.from({ length: q }, (_, i) => { const a = Math.random() * 6.283, r = 90 + Math.random() * 280; return `<i class="fp" style="--x:${Math.cos(a) * r | 0}px;--y:${Math.sin(a) * r * .8 | 0}px;--d:${Math.random() * 140 | 0}ms;background:${cores[i % 3]}"></i>` }).join('');
  if (nivel === 'final') {
    el.innerHTML = `<div class="fin"><h2>Glow Up concluído</h2><p class="mut">Você completou os 30 dias. Compare a foto final com a do primeiro dia e celebre.</p><button class="btn sm" id="fk" type="button">Continuar</button></div>${parts(60)}`;
    const k = $('#fk'); if (k) k.onclick = () => { el.innerHTML = '' };
    return;
  }
  tt.innerHTML = `<div class="toast">${nivel === 'sem' ? `Semana ${n} concluída. Seu glow está se construindo.` : `Dia ${n} concluído. ${30 - nDias() === 1 ? 'Falta 1 dia' : `Faltam ${30 - nDias()} dias`}.`}</div>`;
  el.innerHTML = parts(nivel === 'sem' ? 26 : 10);
  setTimeout(() => { tt.innerHTML = ''; el.innerHTML = '' }, 3000);
}

function telaPainel() {
  PL = gerar(P.resp); mostrado = 0;
  if (!P.aberto) { const p = PL.dias.find(d => !feitoDia(d.n)); if (p) { P.aberto = p.n; P.sem = p.sem } }
  app.innerHTML = `<div class="pl"><div class="top"><span class="bd ok">Assinatura ativa. Acesso até ${dataBR(P.exp)}</span>
  <div class="rt"><span id="rfb"><button class="mini" id="rf" type="button">Refazer questionário</button></span><button class="mini" id="x" type="button">Sair</button></div></div>
  <section class="panel hero"><h1>${esc(PL.titulo)}</h1><p style="max-width:62ch;color:#d6d2d4">${esc(PL.texto)}</p></section>
  <section class="panel" id="pg"><div style="display:flex;align-items:baseline;gap:10px"><b class="serif big" id="pgn">0</b><span class="mut">de 30 dias concluídos</span></div><div class="bar"><i id="pgi" style="width:0%"></i></div></section>
  <section class="panel"><h2>${PL.modo === 'nat' ? 'Seu guia de ingredientes e técnicas' : 'Seu guia de produtos e receitas'}</h2>
  <div class="gg">${PL.guia.map((s, k) => `<div class="gc" style="animation-delay:${k * 80}ms"><h3>${esc(s.t)}</h3><ul>${s.i.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div><p class="mut" style="font-size:.8rem;margin-top:14px">${esc(PL.nota)}</p></section>
  <section class="panel"><h2 style="margin-bottom:14px">Seu cronograma de 30 dias</h2><div id="cron"></div></section>
  ${DEMO ? '<button class="lk" id="pv" type="button">Visualizar tela de bloqueio (teste)</button>' : ''}</div><div id="toast" aria-live="polite"></div><div id="fx" aria-hidden="true"></div>`;
  pintarCron();
  $('#cron').onclick = ev => {
    const g = s => ev.target.closest(s); let b, n0 = 0, a0, s0;
    const antes = n => { n0 = n; a0 = feitoDia(n); s0 = semOk(PL.dias[n - 1].sem) };
    if ((b = g('.wk'))) { P.sem = +b.dataset.s; P.aberto = 0; fx = { sem: 1 } }
    else if ((b = g('.dh'))) { const n = +b.dataset.d; P.aberto = P.aberto === n ? 0 : n; fx = { open: n } }
    else if ((b = g('.itb'))) {
      const k = b.dataset.d + '.' + b.dataset.i; if (P.itm[k] === 's') return;
      antes(+b.dataset.d);
      if (P.feitos[k]) delete P.feitos[k];
      else { P.feitos[k] = 1; fx = { pop: k }; try { navigator.vibrate && navigator.vibrate(12) } catch (e) {} }
    }
    else if ((b = g('[data-all]'))) { const n = +b.dataset.all; antes(n); const tudo = a0; PL.dias[n - 1].itens.forEach((_, i) => { const k = n + '.' + i; if (P.itm[k] === 's') return; if (tudo) delete P.feitos[k]; else P.feitos[k] = 1 }) }
    else if ((b = g('[data-act]'))) {
      const { act, d, i, g: gi } = b.dataset, k = d + '.' + i;
      if (act === 'falta') { gi.split(',').forEach(x => { P.falta[x] = 1 }); delete P.itm[k] }
      else if (act === 'pular') { P.itm[k] = 's'; delete P.feitos[k] }
      else if (act === 'orig') P.itm[k] = 'o';
      else if (act === 'alt' || act === 'desf') delete P.itm[k];
      else if (act === 'voltei') delete P.falta[gi];
      fx = { swap: k };
    }
    else return;
    const fim = n0 && !a0 && feitoDia(n0);
    if (fim) fx.dia = n0;
    salvarP(); pintarCron();
    if (fim) { const w = PL.dias[n0 - 1].sem; if (nDias() === 30) celebrar('final'); else if (!s0 && semOk(w)) celebrar('sem', w + 1); else celebrar('dia', n0) }
  };
  $('#x').onclick = async () => { await api.sair(); ir('inicio') };
  $('#rf').onclick = () => {
    $('#rfb').innerHTML = '<span class="mut" style="font-size:.8rem">Apagar respostas e progresso?</span> <button class="mini danger" id="rs" type="button">Sim, refazer</button> <button class="mini" id="rn" type="button">Cancelar</button>';
    $('#rs').onclick = () => { P = { resp: { nome: P.resp.nome }, etapa: 0, gerado: false, feitos: {}, itm: {}, falta: P.falta, sem: 0, aberto: 0, exp: P.exp }; salvarP(); wizard(1) };
    $('#rn').onclick = () => telaPainel();
  };
  const pv = $('#pv'); if (pv) pv.onclick = telaBloqueio;
}

async function copiar(t) {
  try { await navigator.clipboard.writeText(t) } catch (e) {
    const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
    try { document.execCommand('copy') } catch (x) {} a.remove();
  }
}

// ---------- Painel ADM ----------
function situacao(c) {
  const n = diasAte(c.expira_em);
  if (new Date(c.expira_em) <= Date.now()) return { k: 'bad', t: 'Vencido', f: 'vencido' };
  if (n <= 7) return { k: 'warn', t: `Vence em ${n} ${n === 1 ? 'dia' : 'dias'}`, f: 'vencendo' };
  return { k: 'ok', t: `Ativo, ${n} dias`, f: 'ativo' };
}
const msgAcesso = c => `Olá ${c.nome}! O teu acesso foi liberado por 31 dias. Acede a ${base()}#login com o Usuário: ${c.usuario} e Senha: ${c.senha}.`;
const msgSenha = c => `Olá ${c.nome}! A tua senha foi redefinida. Acede a ${base()}#login com o Usuário: ${c.usuario} e Senha: ${c.senha}.`;

function avisar(tipo, txt, z = '', extra = '') {
  zap = z;
  $('#nota').innerHTML = `<div class="nota${tipo === 'err' ? ' err2' : ''}" role="${tipo === 'err' ? 'alert' : 'status'}"><b>${esc(txt)}</b>${extra}${z ? '<button class="btn sm" id="cz" type="button">Copiar mensagem para WhatsApp</button>' : ''}</div>`;
  const b = $('#cz');
  if (b) b.onclick = async () => { await copiar(zap); b.textContent = 'Mensagem copiada'; setTimeout(() => { b.textContent = 'Copiar mensagem para WhatsApp' }, 2500) };
}

const linha = c => {
  const u = esc(c.usuario), e = ed && ed.u === c.usuario ? ed.t : '';
  const acoes = e === 'senha'
    ? `<input class="inp sm" id="ns" placeholder="Nova senha (mín. 4)" autocomplete="off"><button class="mini" data-a="salvasenha" data-u="${u}">Salvar</button><button class="mini" data-a="cancelar">Cancelar</button>`
    : e === 'excluir'
    ? `<span class="mut">Excluir ${esc(c.nome)} de vez?</span><button class="mini danger" data-a="confexcluir" data-u="${u}">Sim, excluir</button><button class="mini" data-a="cancelar">Cancelar</button>`
    : `<button class="mini" data-a="renovar" data-u="${u}">Renovar +31 dias</button><button class="mini" data-a="senha" data-u="${u}">Nova senha</button><button class="mini" data-a="bloquear" data-u="${u}">Bloquear</button><button class="mini danger" data-a="excluir" data-u="${u}">Excluir</button>`;
  return `<div class="row"><div><b>${esc(c.nome)}</b><br><span class="mut">@${u}</span></div>
  <div class="st"><span class="bd ${c.s.k}">${esc(c.s.t)}</span><br><span class="mut">até ${dataBR(c.expira_em)}</span></div><div class="ac">${acoes}</div></div>`;
};

function pintar() {
  const L = lista.map(c => ({ ...c, s: situacao(c) }));
  const cont = f => L.filter(c => c.s.f === f).length;
  $('#stats').innerHTML = [['Clientes', L.length], ['Ativos', L.length - cont('vencido')], ['Vencem em 7 dias', cont('vencendo')], ['Vencidos', cont('vencido')]]
    .map(([t, n]) => `<div class="stat"><small>${t}</small><b>${n}</b></div>`).join('');
  const q = busca.trim().toLowerCase();
  const F = { todos: () => true, ativos: c => c.s.f !== 'vencido', vencendo: c => c.s.f === 'vencendo', vencidos: c => c.s.f === 'vencido' }[filtro];
  const v = L.filter(c => F(c) && (!q || c.nome.toLowerCase().includes(q) || c.usuario.includes(q)));
  $('#lista').innerHTML = v.length ? v.map(linha).join('')
    : `<p class="mut" style="padding:28px 0;text-align:center">${L.length ? 'Nenhum cliente encontrado.' : 'Nenhum cliente cadastrado ainda.'}</p>`;
}

async function carregar() {
  const r = await api.listar(mestra);
  if (!r.ok) { if (r.erro === 'senha_mestra') { mestra = ''; return telaAdmin() } return avisar('err', MSG[r.erro] || MSG.rede) }
  lista = (r.clientes || []).slice().sort((a, b) => new Date(b.criado_em) - new Date(a.criado_em));
  pintar();
}

const cel = x => { x = String(x); if (/^[=+\-@\t\r]/.test(x)) x = "'" + x; return '"' + x.replace(/"/g, '""') + '"' };

function telaAdmin() {
  if (!mestra) {
    app.innerHTML = `<div class="panel auth"><span class="tag${DEMO ? '' : ' on'}" style="align-self:flex-start">${DEMO ? 'Modo demonstração' : 'Conectado ao Supabase'}</span><div><h1>Administração</h1><p class="mut" style="margin-top:6px">Digite a senha mestra.</p></div>
    <form id="f"><div class="f"><label for="m">Senha mestra</label><div class="pw"><input class="inp" id="m" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required><button class="eye" id="ver" type="button">Mostrar</button></div></div>
    <p class="err" id="e" role="alert" hidden></p>
    ${DEMO ? '' : '<p class="mut" id="dica" style="font-size:.82rem" hidden>Se você acabou de trocar a senha mestra, rode o arquivo 02_atualizacao.sql no Supabase. Ele grava a nova senha e libera qualquer bloqueio por tentativas.</p>'}
    <button class="btn" id="b">Entrar</button></form>
    <button class="lk" id="v" type="button">Voltar</button></div>`;
    $('#v').onclick = () => ir('inicio');
    $('#ver').onclick = () => { const i = $('#m'), v = $('#ver'), oculta = i.type === 'password'; i.type = oculta ? 'text' : 'password'; v.textContent = oculta ? 'Ocultar' : 'Mostrar' };
    $('#f').onsubmit = async ev => {
      ev.preventDefault();
      const b = $('#b'), m = $('#m').value.trim(); b.disabled = true; b.textContent = 'Verificando...';
      const r = await api.adminVerificar(m);
      if (r.ok) { mestra = m; return telaAdmin() }
      b.disabled = false; b.textContent = 'Entrar'; mostrarErro(r);
      const d = $('#dica'); if (d && (r.erro === 'senha_mestra' || r.erro === 'bloqueado')) d.hidden = false;
    };
    return;
  }
  ed = null; busca = ''; filtro = 'todos';
  app.innerHTML = `<div class="dash"><div class="top"><h1>Painel administrativo</h1><div class="rt">
  <span class="tag${DEMO ? '' : ' on'}">${DEMO ? 'Modo demonstração: dados só neste navegador' : 'Dados salvos no Supabase'}</span>
  <button class="mini" id="q" type="button">Sair do painel</button></div></div>
  <div id="nota" aria-live="polite"></div><div class="stats" id="stats"></div>
  <div class="cols"><section class="panel"><h2>Novo cliente</h2><p class="mut" style="margin:4px 0 16px;font-size:.88rem">O acesso dura 31 dias a partir do cadastro.</p>
  <form id="f"><div class="f"><label for="n">Nome do cliente</label><input class="inp" id="n" required></div>
  <div class="f"><label for="u">Usuário</label><input class="inp" id="u" autocapitalize="none" autocomplete="off" required></div>
  <div class="f"><label for="s">Senha (mínimo 4 caracteres)</label><input class="inp" id="s" autocomplete="off" required></div>
  <p class="err" id="e" role="alert" hidden></p><button class="btn" id="bt">Registar cliente</button></form></section>
  <section class="panel"><div class="tools"><input class="inp" id="bu" type="search" placeholder="Buscar por nome ou usuário" aria-label="Buscar cliente">
  <select class="inp" id="fl" aria-label="Filtrar"><option value="todos">Todos</option><option value="ativos">Ativos</option><option value="vencendo">Vencem em 7 dias</option><option value="vencidos">Vencidos</option></select>
  <button class="mini" id="cv" type="button">Copiar lista (CSV)</button></div><div id="lista"></div></section></div></div>`;

  $('#q').onclick = () => ir('inicio');
  $('#bu').oninput = e => { busca = e.target.value; pintar() };
  $('#fl').onchange = e => { filtro = e.target.value; pintar() };
  $('#cv').onclick = async () => {
    const linhas = lista.map(c => [c.nome, c.usuario, c.criado_em, c.expira_em, situacao(c).t].map(cel).join(';'));
    await copiar(['nome;usuario;criado_em;expira_em;situacao', ...linhas].join('\n'));
    avisar('ok', 'Lista copiada. Cole no Excel ou no Google Planilhas.');
  };
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const b = $('#bt'), e = $('#e'); e.hidden = true; b.disabled = true; b.textContent = 'Guardando...';
    const senha = $('#s').value, r = await api.adminCriar(mestra, $('#n').value, $('#u').value, senha);
    b.disabled = false; b.textContent = 'Registar cliente';
    if (!r.ok) return mostrarErro(r);
    ev.target.reset(); ed = null;
    avisar('ok', 'Cliente registado com sucesso!', msgAcesso({ nome: r.nome, usuario: r.usuario, senha }),
      `<span class="mut">Usuário: ${esc(r.usuario)}<br>Senha: ${esc(senha)}<br>Acesso até: ${new Date(r.expira_em).toLocaleString('pt-BR')}</span>`);
    await carregar();
  };
  $('#lista').onclick = async ev => {
    const b = ev.target.closest('button[data-a]'); if (!b) return;
    const a = b.dataset.a, u = b.dataset.u, c = lista.find(x => x.usuario === u);
    if (a === 'cancelar') { ed = null; return pintar() }
    if (a === 'senha' || a === 'excluir') { ed = { u, t: a }; pintar(); const i = $('#ns'); if (i) i.focus(); return }
    b.disabled = true; let r;
    if (a === 'renovar') {
      r = await api.renovar(mestra, u);
      if (r.ok) avisar('ok', `Acesso de ${c.nome} renovado até ${dataBR(r.expira_em)}.`, `Olá ${c.nome}! O teu acesso foi renovado por mais 31 dias, até ${dataBR(r.expira_em)}. Acede a ${base()}#login com o teu usuário e senha de sempre.`);
    } else if (a === 'bloquear') {
      r = await api.bloquear(mestra, u);
      if (r.ok) avisar('ok', `Acesso de ${c.nome} encerrado.`);
    } else if (a === 'confexcluir') {
      r = await api.excluir(mestra, u);
      if (r.ok) avisar('ok', `${c.nome} foi excluído.`);
    } else if (a === 'salvasenha') {
      const n = $('#ns').value; r = await api.redefinir(mestra, u, n);
      if (r.ok) avisar('ok', `Senha de ${c.nome} redefinida.`, msgSenha({ nome: c.nome, usuario: u, senha: n }));
    }
    if (!r || !r.ok) { b.disabled = false; return avisar('err', MSG[(r || {}).erro] || MSG.rede) }
    ed = null; await carregar();
  };
  carregar();
}

async function rota() {
  const h = location.hash.slice(1) || 'inicio', id = ++passo;
  if (h !== 'admin') { mestra = ''; lista = [] }
  if (h === 'admin') return telaAdmin();
  if (h === 'area' || h === 'login') {
    const r = await api.sessao();
    if (id !== passo) return;
    if (r.ok) return h === 'area' ? telaArea(r) : ir('area');
    if (r.erro === 'expirado' && h === 'area') return telaBloqueio();
    if (r.erro === 'sessao' || r.erro === 'expirado') await api.sair();
    if (id !== passo) return;
    if (r.erro === 'expirado') aviso = MSG.expirado;
    else if (r.erro !== 'sessao') aviso = MSG[r.erro] || '';
    return h === 'area' ? ir('login') : telaLogin();
  }
  telaInicio();
}
addEventListener('hashchange', rota);
rota();
</script>
